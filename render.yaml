services:
  - type: web
    name: stakeme-api
    runtime: node
    repo: https://github.com/Slamonmudi/mwqaa-jhz-main
    plan: free
    branch: main
    rootDir: artifacts/api-server
    buildCommand: |
      corepack enable
      corepack prepare pnpm@latest --activate
      pnpm install --frozen-lockfile
      pnpm run build
    startCommand: node dist/index.mjs
    # ملاحظة: هذا السطر لن يعمل إذا لم يكن السيرفر مبرمجاً لخدمة هذه الملفات
    # يجب إضافة مسار الواجهة الخاص بك هنا:
    staticPublishPath: ../public  
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: stakeme-api
    runtime: node
    repo: https://github.com/Slamonmudi/mwqaa-jhz-main
    plan: free
    branch: main
    rootDir: artifacts/api-server
    buildCommand: |
      corepack enable
      corepack prepare pnpm@latest --activate
      pnpm install --frozen-lockfile
      pnpm run build
    startCommand: node dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: web
    name: stakeme-frontend
    runtime: static
    repo: https://github.com/Slamonmudi/mwqaa-jhz-main
    branch: main
    rootDir: artifacts/jahez-landing
    buildCommand: |
      corepack enable
      corepack prepare pnpm@latest --activate
      pnpm install --frozen-lockfile
      pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
